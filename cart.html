<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - RALAT CRUNCHIES</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-item {
      background: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quantity-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }
    .order-form {
      background: #f8f1e3;
      padding: 25px;
      border-radius: 12px;
      margin: 30px 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo">
      <a href="index.html">🥥 RALAT CRUNCHIES</a>
      <span>PREMIUM COCONUT CHIPS</span>
    </div>
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="cart.html" class="active">Cart (<span id="cartCount">0</span>)</a></li>
      <li><a href="https://wa.me/2347061172586" target="_blank"><i class="fab fa-whatsapp"></i> Order Now</a></li>
    </ul>
  </div>
</nav>

<section class="cart-section" style="padding: 60px 20px; min-height: 70vh;">
  <div class="container">
    <h1 style="text-align:center;">🛒 Your Cart</h1>
    
    <div id="cart-items" style="margin: 30px 0;"></div>
    
    <!-- Customer Details Form -->
    <div class="order-form">
      <h2 style="margin-bottom:20px;">Delivery Information</h2>
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="customer-name" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" id="customer-phone" placeholder="e.g. 0706 117 2586" required>
      </div>
      <div class="form-group">
        <label>Delivery Address *</label>
        <textarea id="customer-address" rows="3" placeholder="Full address with landmark" required></textarea>
      </div>
    </div>
    
    <div class="cart-summary" style="text-align: center; padding: 25px; background: #f8f1e3; border-radius: 12px;">
      <h2>Total: <span id="cart-total" style="color:#d97706; font-size: 1.8rem;">₦0</span></h2>
      
      <div style="margin: 25px 0 10px;">
        <button onclick="clearCart()" style="margin: 8px; padding: 12px 24px;">Clear Cart</button>
        <button onclick="checkoutViaWhatsApp()" 
                style="padding: 14px 32px; background:#25D366; color:white; border:none; border-radius:50px; font-size:1.1rem; cursor:pointer;">
          <i class="fab fa-whatsapp"></i> Send Order via WhatsApp
        </button>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <p>&copy; 2026 Ralat Crunchies. All Rights Reserved.</p>
  </div>
</footer>

<script src="store.js"></script>
<script>
// Render cart
function renderCart() {
  const container = document.getElementById('cart-items');
  const totalEl = document.getElementById('cart-total');
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  
  if (cart.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:60px;"><h3>Your cart is empty</h3><a href="shop.html">Continue Shopping</a></div>`;
    totalEl.textContent = '₦0';
    return;
  }

  let html = '';
  let total = 0;

  cart.forEach((item, index) => {
    const qty = item.quantity || 1;
    const itemTotal = item.price * qty;
    total += itemTotal;
    
    html += `
      <div class="cart-item">
        <div>
          <strong>${item.name}</strong><br>
          <span style="color:#666;">₦${item.price} each</span>
        </div>
        <div class="quantity-controls">
          <button onclick="changeQuantity(${index}, -1)" class="quantity-btn">-</button>
          <span style="font-weight:600; min-width:30px; text-align:center;">${qty}</span>
          <button onclick="changeQuantity(${index}, 1)" class="quantity-btn">+</button>
        </div>
        <div style="text-align:right;">
          <strong>₦${itemTotal}</strong><br>
          <button onclick="removeFromCart(${index})" style="color:red; background:none; border:none;">Remove</button>
        </div>
      </div>`;
  });

  container.innerHTML = html;
  totalEl.textContent = '₦' + total;
}

function changeQuantity(index, change) {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let newQty = (cart[index].quantity || 1) + change;
  if (newQty < 1) cart.splice(index, 1);
  else cart[index].quantity = newQty;
  
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
  updateCartCount();
}

function removeFromCart(index) {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  cart.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
  updateCartCount();
}

function clearCart() {
  if (confirm("Clear entire cart?")) {
    localStorage.removeItem('cart');
    renderCart();
    updateCartCount();
  }
}

function checkoutViaWhatsApp() {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  if (cart.length === 0) return alert("Your cart is empty!");

  const name = document.getElementById('customer-name').value.trim();
  const phone = document.getElementById('customer-phone').value.trim();
  const address = document.getElementById('customer-address').value.trim();

  if (!name || !phone || !address) {
    alert("Please fill in all delivery information!");
    return;
  }

  let message = `Hi Ralat Crunchies!%0A%0A`;
  message += `👤 *Name:* ${encodeURIComponent(name)}%0A`;
  message += `📞 *Phone:* ${encodeURIComponent(phone)}%0A`;
  message += `📍 *Delivery Address:* ${encodeURIComponent(address)}%0A%0A`;
  message += `🛒 *Order Details:*%0A%0A`;

  let total = 0;
  cart.forEach(item => {
    const qty = item.quantity || 1;
    const itemTotal = item.price * qty;
    message += `• ${item.name} × ${qty} = ₦${itemTotal}%0A`;
    total += itemTotal;
  });

  message += `%0A*Total:* ₦${total}%0A%0A`;
  message += `Please confirm my order. Thank you!`;

  window.open(`https://wa.me/2347061172586?text=${message}`, '_blank');
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  renderCart();
  updateCartCount();
});
</script>
</body>
</html>
