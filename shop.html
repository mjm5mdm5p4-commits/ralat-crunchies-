<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - RALAT CRUNCHIES</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo">
      <a href="index.html">🥥 RALAT CRUNCHIES</a>
    </div>
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="https://wa.me/2347061172586" target="_blank">Order Now</a></li>
    </ul>
  </div>
</nav>

<section class="shop-hero">
  <div class="container">
    <h1>Our Collection</h1>
  </div>
</section>

<section class="shop-products">
  <div class="container">
    <div class="products-grid" id="products-container"></div>
  </div>
</section>

<script src="Store.js"></script>
<script>
// Stable version - Original products always show + new ones from Admin
function loadShopProducts() {
  const container = document.getElementById('products-container');
  
  // Original products (will never disappear)
  let products = [
    {id: 1, name: "Gold Foil Pouch", price: 500, image: "gold-pouch.jpg"},
    {id: 2, name: "Premium Glass Jar", price: 2500, image: "red-jar.jpg"},
    {id: 3, name: "Convenient Bottle", price: 1500, image: "bottle.jpg"}
  ];

  // Add new products from Admin
  let adminProducts = JSON.parse(localStorage.getItem('ralatProducts')) || [];
  products = [...products, ...adminProducts];

  let html = '';
  products.forEach(product => {
    html += `
      <div class="product-card">
        <img src="${product.image}" alt="${product.name}" 
             onerror="this.src='https://via.placeholder.com/300x200/8B4513/fff?text=${encodeURIComponent(product.name)}'">
        <h3>${product.name}</h3>
        <p>₦${product.price}</p>
        <button onclick="addToCart(${product.id}, '${product.name}', ${product.price})">Add to Cart</button>
      </div>`;
  });

  container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', loadShopProducts);
</script>
</body>
</html>
